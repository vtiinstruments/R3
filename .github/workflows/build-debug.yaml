name: Build-Debug

on:
  push:
    branches: [master, "powerdaq/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-dotnet:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild R3.sln /restore /t:Build /p:Configuration=Release /m /bl:build.binlog
      - run: dotnet test tests\R3.Tests\R3.Tests.csproj -c Release --no-build --no-restore /bl:tests.binlog
