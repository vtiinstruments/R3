name: Build-Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dotnet:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild R3.sln /restore /t:Build /p:Configuration=Release /m /bl:build.binlog
      - run: dotnet test tests\R3.Tests\R3.Tests.csproj -c Release --no-build --no-restore /bl:tests.binlog
      - run: msbuild src\R3\R3.csproj /t:Pack /p:Configuration=Release /p:NoBuild=true /p:PackageOutputPath=..\..\publish /bl:pack-core.binlog
      - run: msbuild src\R3.WPF\R3.WPF.csproj /t:Pack /p:Configuration=Release /p:NoBuild=true /p:PackageOutputPath=..\..\publish /bl:pack-wpf.binlog
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: publish
